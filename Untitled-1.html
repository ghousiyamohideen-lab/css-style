<!DOCTYPE html>
<html>
    <head>
    <style>
        .container{
            display: grid;
            grid-template-columns: auto auto auto;
            background-color:brown;
            justify-content: start;
            padding:10px;
        } 
        .container1{
            display:grid;
            grid-template-columns: auto auto auto;
            background-color:brown;
            justify-content: end;
            column-gap:50px;
            padding:10px;
        }
        .container div{
            background-color: #630f74;
            border: 1px solid black;
            padding: 10px;
            font-size: 30px;
            text-align: center;
        }
        .container1 div{
            background-color: #f1f1f1;
            border: 1px solid black;
            padding: 10px;
            font-size: 30px;
            text-align: center;
        }
        </style>
    </head>
    <body>
            <h1>Grid layout</h1>
            <p>A grid layout with 5 containers</p>
            <div class="container">
                <div>1</div>
                <div>2</div>
                <div>3</div>
                <div>4</div>
                <div>5</div>
                </div>
                <p>A grid layout with 4 containers with a column gap of 50px</p>
            <div class="container1">
                <div>1</div>
                <div>2</div>
                <div>3</div>
                <div>4</div>
                </div>
                <p>A grid layout with 3 containers</p>
            <div class="container">
                <div>1</div>
                <div>2</div>
                <div>3</div>
                </div>
                 <p>A grid layout with 2 containers</p>
            <div class="container">
                <div>1</div>
                <div>2</div>
                </div>
                 <p>A grid layout with 1 containers</p>
            <div class="container">
                <div>1</div>
                </div>
                </body>
</html>
